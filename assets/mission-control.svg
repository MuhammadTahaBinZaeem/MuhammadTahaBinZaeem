<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Mission control profile section">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="0.55" stop-color="#eef2ff"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.5" stop-color="#2563eb"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.16"/></filter>
    <style>
      .title{font:900 36px 'Segoe UI',Inter,Arial,sans-serif;fill:#0f172a}.sub{font:700 16px 'Segoe UI',Inter,Arial,sans-serif;fill:#475569}.head{font:900 24px 'Segoe UI',Inter,Arial,sans-serif;fill:#f8fafc}.body{font:700 14px 'Segoe UI',Inter,Arial,sans-serif;fill:#cbd5e1}.chip{font:800 13px 'Segoe UI',Inter,Arial,sans-serif;fill:#0f172a}.pulse{animation:pulse 2.4s ease-in-out infinite;transform-origin:center}.pulse2{animation-delay:.7s}.pulse3{animation-delay:1.4s}.scan{animation:scan 5s linear infinite}.dash{stroke-dasharray:10 15;animation:dash 5s linear infinite}@keyframes pulse{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}@keyframes scan{from{transform:translateX(-250px)}to{transform:translateX(1250px)}}@keyframes dash{to{stroke-dashoffset:-220}}
    </style>
  </defs>
  <rect width="1200" height="520" rx="32" fill="url(#bg)"/>
  <rect x="40" y="38" width="1120" height="444" rx="28" fill="#ffffff" opacity="0.72" stroke="#e2e8f0"/>
  <text x="600" y="86" text-anchor="middle" class="title">Mission Control</text>
  <text x="600" y="114" text-anchor="middle" class="sub">Computer architecture, AI-assisted engineering, and products that survive beyond the demo</text>
  <rect x="360" y="132" width="480" height="4" rx="2" fill="url(#accent)"/>
  <g opacity=".18"><path d="M80 170 H1120 M80 250 H1120 M80 330 H1120 M80 410 H1120" stroke="#64748b"/><path d="M170 150 V450 M340 150 V450 M510 150 V450 M680 150 V450 M850 150 V450 M1020 150 V450" stroke="#64748b"/></g>
  <path d="M245 320 C375 220 505 425 625 318 S870 230 955 318" fill="none" stroke="url(#accent)" stroke-width="3" class="dash" opacity=".7"/>
  <rect class="scan" x="-180" y="150" width="180" height="300" fill="url(#accent)" opacity=".08"/>
  <g filter="url(#shadow)"><rect x="92" y="178" width="300" height="238" rx="26" fill="url(#dark)"/><rect x="450" y="178" width="300" height="238" rx="26" fill="url(#dark)"/><rect x="808" y="178" width="300" height="238" rx="26" fill="url(#dark)"/></g>
  <circle class="pulse" cx="126" cy="210" r="8" fill="#a78bfa"/><circle class="pulse pulse2" cx="484" cy="210" r="8" fill="#60a5fa"/><circle class="pulse pulse3" cx="842" cy="210" r="8" fill="#34d399"/>
  <text x="242" y="232" text-anchor="middle" class="head">ARCHITECTURE DSE</text>
  <text x="242" y="272" text-anchor="middle" class="body">ParetoCo explores heterogeneous systems</text>
  <text x="242" y="298" text-anchor="middle" class="body">CPU · GPU · DSP · NPU · accelerators</text>
  <text x="242" y="324" text-anchor="middle" class="body">constraints + SDF + Pareto trade-offs</text>
  <rect x="137" y="355" width="210" height="34" rx="17" fill="#ddd6fe"/>
  <text x="242" y="377" text-anchor="middle" class="chip">deterministic source of truth</text>
  <text x="600" y="232" text-anchor="middle" class="head">AI → NATIVE EDA</text>
  <text x="600" y="272" text-anchor="middle" class="body">ProGenEDA turns circuit intent into</text>
  <text x="600" y="298" text-anchor="middle" class="body">structured, editable project artifacts</text>
  <text x="600" y="324" text-anchor="middle" class="body">7,000+ public Proteus circuits</text>
  <rect x="495" y="355" width="210" height="34" rx="17" fill="#bfdbfe"/>
  <text x="600" y="377" text-anchor="middle" class="chip">validation before generation</text>
  <text x="958" y="232" text-anchor="middle" class="head">PRODUCT + RESEARCH</text>
  <text x="958" y="272" text-anchor="middle" class="body">Type2Learn, reproducible pipelines,</text>
  <text x="958" y="298" text-anchor="middle" class="body">MIPS / Verilog and systems work</text>
  <text x="958" y="324" text-anchor="middle" class="body">from user-facing AI to low-level logic</text>
  <rect x="853" y="355" width="210" height="34" rx="17" fill="#a7f3d0"/>
  <text x="958" y="377" text-anchor="middle" class="chip">breadth backed by artifacts</text>
</svg>
