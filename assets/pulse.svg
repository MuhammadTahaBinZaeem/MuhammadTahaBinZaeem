<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-label="Four flagship areas: ParetoCo, ProGenEDA, Type2Learn, and systems engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="0.55" stop-color="#111827"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="0.55" stop-color="#60a5fa"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/></filter>
    <style>.title{font:900 34px 'Segoe UI',Inter,Arial,sans-serif;fill:#f8fafc}.sub{font:600 15px 'Segoe UI',Inter,Arial,sans-serif;fill:#cbd5e1}.num{font:900 29px 'Segoe UI',Inter,Arial,sans-serif;fill:#ffffff}.label{font:800 16px 'Segoe UI',Inter,Arial,sans-serif;fill:#c4b5fd}.desc{font:600 12px 'Segoe UI',Inter,Arial,sans-serif;fill:#94a3b8}</style>
  </defs>
  <rect width="1100" height="390" rx="28" fill="url(#bg)"/>
  <circle cx="150" cy="90" r="130" fill="#7c3aed" opacity="0.16"/><circle cx="960" cy="300" r="150" fill="#22c55e" opacity="0.12"/>
  <path d="M55 265 C190 185 315 305 440 235 S680 180 805 245 S980 270 1040 210" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.55"/>
  <text x="550" y="62" text-anchor="middle" class="title">What I Build</text>
  <text x="550" y="90" text-anchor="middle" class="sub">ParetoCo · ProGenEDA · Type2Learn · low-level systems</text>
  <rect x="350" y="108" width="400" height="4" rx="2" fill="url(#accent)"/>
  <g filter="url(#shadow)"><rect x="55" y="150" width="235" height="155" rx="24" fill="#0f172a" stroke="#334155"/><rect x="310" y="150" width="235" height="155" rx="24" fill="#0f172a" stroke="#334155"/><rect x="565" y="150" width="235" height="155" rx="24" fill="#0f172a" stroke="#334155"/><rect x="820" y="150" width="225" height="155" rx="24" fill="#0f172a" stroke="#334155"/></g>
  <text x="172.5" y="199" text-anchor="middle" class="num">ARCH DSE</text><text x="172.5" y="231" text-anchor="middle" class="label">ParetoCo</text><text x="172.5" y="255" text-anchor="middle" class="desc">constraints · SDF · Pareto fronts</text><text x="172.5" y="276" text-anchor="middle" class="desc">heterogeneous design spaces</text>
  <text x="427.5" y="199" text-anchor="middle" class="num">AI → EDA</text><text x="427.5" y="231" text-anchor="middle" class="label">ProGenEDA</text><text x="427.5" y="255" text-anchor="middle" class="desc">native files · validation · repair</text><text x="427.5" y="276" text-anchor="middle" class="desc">7,000+ public Proteus circuits</text>
  <text x="682.5" y="199" text-anchor="middle" class="num">ACCESS</text><text x="682.5" y="231" text-anchor="middle" class="label">Type2Learn</text><text x="682.5" y="255" text-anchor="middle" class="desc">active learning · learner controls</text><text x="682.5" y="276" text-anchor="middle" class="desc">AI with user agency</text>
  <text x="932.5" y="199" text-anchor="middle" class="num">LOW LEVEL</text><text x="932.5" y="231" text-anchor="middle" class="label">Systems</text><text x="932.5" y="255" text-anchor="middle" class="desc">MIPS · Verilog · architecture</text><text x="932.5" y="276" text-anchor="middle" class="desc">reproducible engineering</text>
