<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" role="img" aria-label="Current build map">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f5f9"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.5" stop-color="#2563eb"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>.title{font:800 34px 'Segoe UI',Inter,Arial,sans-serif;fill:#0f172a}.sub{font:600 15px 'Segoe UI',Inter,Arial,sans-serif;fill:#475569}.label{font:800 18px 'Segoe UI',Inter,Arial,sans-serif;fill:#111827}.small{font:600 12.5px 'Segoe UI',Inter,Arial,sans-serif;fill:#64748b}.edge{fill:none;stroke:#475569;stroke-width:2.1;marker-end:url(#arrow)}.node{fill:url(#node);stroke:#c4b5fd;stroke-width:2.2;filter:url(#shadow)}.green{stroke:#86efac}.blue{stroke:#93c5fd}.purple{stroke:#c4b5fd}.amber{stroke:#fde68a}</style>
  </defs>
  <rect width="1100" height="690" rx="28" fill="url(#bg)"/>
  <rect x="40" y="40" width="1020" height="610" rx="24" fill="#ffffff" opacity="0.72" stroke="#e2e8f0"/>
  <text x="550" y="88" text-anchor="middle" class="title">Current Build Map</text>
  <text x="550" y="116" text-anchor="middle" class="sub">Different domains, same habit: structure the problem, verify the result, keep the artifact reproducible</text>
  <rect x="300" y="132" width="500" height="4" rx="2" fill="url(#accent)"/>

  <rect x="70" y="170" width="185" height="82" rx="18" class="node purple"/>
  <text x="162.5" y="204" text-anchor="middle" class="label">Problem / Intent</text><text x="162.5" y="228" text-anchor="middle" class="small">requirements, constraints, goals</text>
  <rect x="335" y="170" width="190" height="82" rx="18" class="node blue"/>
  <text x="430" y="204" text-anchor="middle" class="label">Structured Model</text><text x="430" y="228" text-anchor="middle" class="small">IR, workload, state, architecture</text>
  <rect x="605" y="170" width="205" height="82" rx="18" class="node green"/>
  <text x="707.5" y="204" text-anchor="middle" class="label">Verify / Search</text><text x="707.5" y="228" text-anchor="middle" class="small">constraints, tests, validation</text>
  <rect x="885" y="170" width="150" height="82" rx="18" class="node amber"/>
  <text x="960" y="204" text-anchor="middle" class="label">Artifact</text><text x="960" y="228" text-anchor="middle" class="small">file, frontier, product</text>

  <rect x="70" y="335" width="220" height="92" rx="18" class="node purple"/>
  <text x="180" y="368" text-anchor="middle" class="label">ParetoCo</text><text x="180" y="392" text-anchor="middle" class="small">heterogeneous architecture DSE</text><text x="180" y="411" text-anchor="middle" class="small">Gecode + SDF + Pareto analysis</text>
  <rect x="320" y="335" width="220" height="92" rx="18" class="node blue"/>
  <text x="430" y="368" text-anchor="middle" class="label">ProGenEDA</text><text x="430" y="392" text-anchor="middle" class="small">intent → circuit IR → native EDA</text><text x="430" y="411" text-anchor="middle" class="small">validation + repair + export</text>
  <rect x="570" y="335" width="220" height="92" rx="18" class="node green"/>
  <text x="680" y="368" text-anchor="middle" class="label">Type2Learn</text><text x="680" y="392" text-anchor="middle" class="small">accessible active learning</text><text x="680" y="411" text-anchor="middle" class="small">learner control + adaptive support</text>
  <rect x="820" y="335" width="215" height="92" rx="18" class="node amber"/>
  <text x="927.5" y="368" text-anchor="middle" class="label">Low-Level Systems</text><text x="927.5" y="392" text-anchor="middle" class="small">MIPS + Verilog + architecture</text><text x="927.5" y="411" text-anchor="middle" class="small">state, memory, logic, tooling</text>

  <rect x="240" y="520" width="260" height="88" rx="18" class="node purple"/>
  <text x="370" y="554" text-anchor="middle" class="label">Reproducibility Trail</text><text x="370" y="578" text-anchor="middle" class="small">sessions, snapshots, logs, metadata</text>
  <rect x="600" y="520" width="260" height="88" rx="18" class="node blue"/>
  <text x="730" y="554" text-anchor="middle" class="label">Public / Testable Output</text><text x="730" y="578" text-anchor="middle" class="small">frontier, native project, demo, paper</text>

