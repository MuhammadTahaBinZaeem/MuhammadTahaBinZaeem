<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-label="Current build map">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font:800 34px 'Segoe UI',Inter,Arial,sans-serif;fill:#0f172a}
      .sub{font:600 15px 'Segoe UI',Inter,Arial,sans-serif;fill:#475569}
      .label{font:800 20px 'Segoe UI',Inter,Arial,sans-serif;fill:#111827}
      .small{font:600 13px 'Segoe UI',Inter,Arial,sans-serif;fill:#64748b}
      .edge{fill:none;stroke:#475569;stroke-width:2.2;marker-end:url(#arrow)}
      .node{fill:url(#node);stroke:#c4b5fd;stroke-width:2.2;filter:url(#shadow)}
      .green{stroke:#86efac}
      .blue{stroke:#93c5fd}
      .purple{stroke:#c4b5fd}
    </style>
  </defs>

  <rect width="1100" height="650" rx="28" fill="url(#bg)"/>
  <rect x="40" y="40" width="1020" height="570" rx="24" fill="#ffffff" opacity="0.72" stroke="#e2e8f0"/>
  <text x="550" y="88" text-anchor="middle" class="title">Current Build Map</text>
  <text x="550" y="116" text-anchor="middle" class="sub">How my projects move from imagination to reproducible output</text>
  <rect x="320" y="132" width="460" height="4" rx="2" fill="url(#accent)"/>

  <!-- Nodes -->
  <rect x="80" y="175" width="170" height="82" rx="18" class="node purple"/>
  <text x="165" y="209" text-anchor="middle" class="label">Raw Idea</text>
  <text x="165" y="233" text-anchor="middle" class="small">uncompiled spec</text>

  <rect x="350" y="175" width="190" height="82" rx="18" class="node blue"/>
  <text x="445" y="209" text-anchor="middle" class="label">Prototype</text>
  <text x="445" y="233" text-anchor="middle" class="small">prove the core</text>

  <rect x="660" y="175" width="230" height="82" rx="18" class="node green"/>
  <text x="775" y="209" text-anchor="middle" class="label">Testable Artifact</text>
  <text x="775" y="233" text-anchor="middle" class="small">files, outputs, checks</text>

  <rect x="80" y="335" width="225" height="88" rx="18" class="node purple"/>
  <text x="192.5" y="369" text-anchor="middle" class="label">Progen</text>
  <text x="192.5" y="393" text-anchor="middle" class="small">AI → Proteus project</text>

  <rect x="350" y="335" width="225" height="88" rx="18" class="node blue"/>
  <text x="462.5" y="369" text-anchor="middle" class="label">MIPS Lab</text>
  <text x="462.5" y="393" text-anchor="middle" class="small">assembly + architecture</text>

  <rect x="620" y="335" width="225" height="88" rx="18" class="node green"/>
  <text x="732.5" y="369" text-anchor="middle" class="label">Research Pipeline</text>
  <text x="732.5" y="393" text-anchor="middle" class="small">metadata + reproducibility</text>

  <rect x="350" y="500" width="260" height="88" rx="18" class="node purple"/>
  <text x="480" y="534" text-anchor="middle" class="label">Logs + Manifests</text>
  <text x="480" y="558" text-anchor="middle" class="small">audit trail, not vibes</text>

  <rect x="700" y="500" width="270" height="88" rx="18" class="node blue"/>
  <text x="835" y="534" text-anchor="middle" class="label">Public Output</text>
  <text x="835" y="558" text-anchor="middle" class="small">demo, paper, product</text>

  <!-- Edges -->
  <path d="M250 216 H342" class="edge"/>
  <path d="M540 216 H652" class="edge"/>
  <path d="M705 257 C620 285 560 305 500 332" class="edge"/>
  <path d="M390 257 C320 290 250 310 205 332" class="edge"/>
  <path d="M775 257 C770 285 748 310 738 332" class="edge"/>
  <path d="M305 379 H342" class="edge"/>
  <path d="M575 379 H612" class="edge"/>
  <path d="M462 423 C462 455 468 475 474 492" class="edge"/>
  <path d="M732 423 C665 458 600 480 544 497" class="edge"/>
  <path d="M610 544 H692" class="edge"/>
</svg>
