<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-label="Muhammad Taha Bin Zaeem profile hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617">
        <animate attributeName="stop-color" values="#020617;#111827;#1e1b4b;#020617" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.48" stop-color="#111827">
        <animate attributeName="stop-color" values="#111827;#1e293b;#312e81;#111827" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#312e81">
        <animate attributeName="stop-color" values="#312e81;#7c3aed;#0f766e;#312e81" dur="11s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="violetGlow" cx="22%" cy="18%" r="55%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="84%" cy="76%" r="55%">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .grid{opacity:.16}
      .card{filter:url(#shadow)}
      .flow{fill:none;stroke:url(#line);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:14 18;animation:dash 5.5s linear infinite;opacity:.72}
      .flow2{animation-duration:7.5s;opacity:.45}
      .spark{filter:url(#softGlow);animation:pulse 2.2s ease-in-out infinite;transform-origin:center}
      .spark2{animation-delay:.4s}.spark3{animation-delay:.8s}.spark4{animation-delay:1.2s}
      .blink{animation:blink 1.4s steps(2,end) infinite}
      .float{animation:float 5s ease-in-out infinite}
      .float2{animation-delay:1s}.float3{animation-delay:2s}
      .scanline{animation:scanMove 4.2s ease-in-out infinite}
      .title{font-family:Segoe UI, Inter, Arial, sans-serif;font-size:54px;font-weight:950;letter-spacing:3px;fill:#f8fafc}
      .subtitle{font-family:Segoe UI, Inter, Arial, sans-serif;font-size:22px;font-weight:800;fill:#d8b4fe}
      .terminal{font-family:Consolas, JetBrains Mono, monospace;font-size:18px;font-weight:800;fill:#86efac}
      @keyframes dash{to{stroke-dashoffset:-260}}
      @keyframes pulse{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.55)}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.25}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      @keyframes scanMove{0%{transform:translateX(-520px)}55%,100%{transform:translateX(520px)}}
    </style>
  </defs>

  <rect width="1200" height="390" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="390" rx="34" fill="url(#violetGlow)">
    <animate attributeName="opacity" values="0.72;1;0.62;0.9;0.72" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect width="1200" height="390" rx="34" fill="url(#greenGlow)">
    <animate attributeName="opacity" values="0.45;0.75;0.35;0.65;0.45" dur="7s" repeatCount="indefinite"/>
  </rect>

  <g class="grid">
    <path d="M0 70 H1200 M0 145 H1200 M0 220 H1200 M0 295 H1200" stroke="#c4b5fd"/>
    <path d="M95 0 V390 M230 0 V390 M365 0 V390 M500 0 V390 M635 0 V390 M770 0 V390 M905 0 V390 M1040 0 V390" stroke="#c4b5fd"/>
  </g>

  <path class="flow" d="M50 315 C190 235 300 360 442 282 S714 202 855 285 S1080 305 1140 232"/>
  <path class="flow flow2" d="M80 110 C230 58 375 122 520 93 S780 62 910 118 S1050 155 1160 90"/>

  <g class="float">
    <circle class="spark" cx="160" cy="95" r="6" fill="#34d399"/>
    <circle class="spark spark2" cx="190" cy="95" r="6" fill="#60a5fa"/>
    <circle class="spark spark3" cx="220" cy="95" r="6" fill="#a78bfa"/>
    <circle class="spark spark4" cx="250" cy="95" r="6" fill="#facc15"/>
  </g>
  <g class="float float2">
    <circle class="spark" cx="1010" cy="82" r="5" fill="#34d399"/>
    <circle class="spark spark3" cx="1040" cy="110" r="4" fill="#60a5fa"/>
    <circle class="spark spark2" cx="1080" cy="92" r="6" fill="#a78bfa"/>
  </g>
  <g class="float float3">
    <circle class="spark spark2" cx="112" cy="302" r="5" fill="#a78bfa"/>
    <circle class="spark spark4" cx="990" cy="302" r="5" fill="#34d399"/>
  </g>

  <g class="card">
    <rect x="70" y="82" width="1060" height="220" rx="30" fill="#0f172a" opacity="0.76" stroke="#334155"/>
    <rect x="70" y="82" width="1060" height="220" rx="30" fill="none" stroke="url(#line)" stroke-width="2.5" opacity="0.98">
      <animate attributeName="stroke-width" values="2.2;4.2;2.2" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.65;1;0.65" dur="3.8s" repeatCount="indefinite"/>
    </rect>
    <rect class="scanline" x="70" y="82" width="230" height="220" rx="30" fill="url(#scan)" opacity="0.9"/>
  </g>

  <text x="600" y="158" text-anchor="middle" class="title">MUHAMMAD TAHA BIN ZAEEM</text>
  <text x="600" y="204" text-anchor="middle" class="subtitle">Computer Engineering @ NUST CEME • ProGenEDA • Type2Learn • Systems Engineering</text>

  <rect x="285" y="236" width="630" height="48" rx="24" fill="#020617" opacity="0.86" stroke="#475569"/>
  <text x="600" y="267" text-anchor="middle" class="terminal">native EDA → accessible learning → tested systems<tspan class="blink">_</tspan></text>

  <circle cx="92" cy="97" r="3" fill="#ffffff" opacity="0.55">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1108" cy="287" r="3" fill="#86efac" opacity="0.55">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
